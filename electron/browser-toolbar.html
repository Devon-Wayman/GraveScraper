<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" /><title>GraveScraper Browser</title><link rel="stylesheet" href="browser-toolbar.css" /></head>
<body><nav aria-label="Browser navigation"><button id="back" title="Back" aria-label="Back" disabled>←</button><button id="forward" title="Forward" aria-label="Forward" disabled>→</button><button id="refresh" title="Refresh" aria-label="Refresh">↻</button><button id="original" title="Return to the page opened from GraveScraper">Original page</button><input id="address" aria-label="Current page address" readonly /><span id="status" role="status" aria-live="polite"></span></nav><script src="browser-toolbar.js"></script></body>
</html>
